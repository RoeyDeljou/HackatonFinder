name: probe-sources
on:
  push:
    branches: [probe]
    paths: [probe/**, .github/workflows/probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe/probe.mjs
      - run: |
          git config user.name probe-bot && git config user.email probe@users.noreply.github.com
          git add -f out && git commit -m "probe output [skip ci]" && git push
