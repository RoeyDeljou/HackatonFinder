name: probe-sources
on:
  push:
    branches: [probe]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe/probe.mjs
      - uses: actions/upload-artifact@v4
        with: { name: probe-out, path: out/ }
