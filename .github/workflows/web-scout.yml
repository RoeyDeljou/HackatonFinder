# Runs the free web search (DuckDuckGo) from GitHub's servers ~20-30 min
# before each 10:00 / 18:00 Israel-time search, and posts results to the app.
# Needs repo secrets APP_URL and CRON_SECRET (same value as in Vercel).
name: web-scout
on:
  # Every 2 hours from 06:35 to 18:35 UTC (each run continues the query list
  # where the last stopped), so all fields are covered before the 10:00 and
  # 18:00 Israel-time searches.
  schedule:
    - cron: '35 6-18/2 * * *'
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/web-scout.mjs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
