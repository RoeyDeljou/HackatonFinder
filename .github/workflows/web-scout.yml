# Runs the free web search (DuckDuckGo) from GitHub's servers ~20-30 min
# before each 10:00 / 18:00 Israel-time search, and posts results to the app.
# Needs repo secrets APP_URL and CRON_SECRET (same value as in Vercel).
name: web-scout
on:
  schedule:
    - cron: '35 6 * * *'   # 09:35 summer / 08:35 winter
    - cron: '35 7 * * *'   # 10:35 summer / 09:35 winter
    - cron: '35 14 * * *'  # 17:35 summer / 16:35 winter
    - cron: '35 15 * * *'  # 18:35 summer / 17:35 winter
  workflow_dispatch:
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/web-scout.mjs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
