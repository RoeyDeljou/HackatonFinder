# Backup scheduler: calls the same cron endpoints ~1h after Vercel Cron.
# The server skips a slot that already ran, so this only does work if the
# Vercel run was missed or failed. Needs repo secrets APP_URL and CRON_SECRET.
name: backup-cron
on:
  # UTC times covering both Israel summer (UTC+3) and winter (UTC+2) time.
  # The server ignores calls outside each job's local-time window.
  schedule:
    - cron: '40 7 * * *'   # morning search (10:40 summer)
    - cron: '40 8 * * *'   # morning search (10:40 winter)
    - cron: '40 15 * * *'  # afternoon search (18:40 summer)
    - cron: '40 16 * * *'  # afternoon search (18:40 winter)
    - cron: '40 19 * * *'  # end-of-day digest (22:40 summer / 21:40 winter)
  workflow_dispatch:
    inputs:
      job:
        description: 'search-morning | search-afternoon | digest'
        default: search-morning
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call cron endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ github.event.inputs.job }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not set, skipping"; exit 0; fi
          case "$SCHEDULE${INPUT_JOB}" in
            "40 7 * * *"|"40 8 * * *"|search-morning) Q="job=search&slot=morning" ;;
            "40 15 * * *"|"40 16 * * *"|search-afternoon) Q="job=search&slot=afternoon" ;;
            *) Q="job=digest" ;;
          esac
          curl -sS --fail-with-body -m 320 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron?$Q"
